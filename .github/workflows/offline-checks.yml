name: Offline syntax and contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile Python examples
        run: python -m compileall -q examples/python tests
      - name: Run offline contract tests
        run: python -m unittest discover -s tests -v
      - name: Check Node example syntax
        run: |
          node --check examples/node/common.mjs
          node --check examples/node/chat_messages.mjs
          node --check examples/node/image_edit.mjs
          node --check examples/node/media_async.mjs
      - name: Run offline Node contract tests
        run: node --test tests/test_node_contracts.mjs
